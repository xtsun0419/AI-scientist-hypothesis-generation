[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-agent"
version = "0.1.0"
description = "Multi-agent literature discovery CLI for permanent magnet research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Scientist Literature Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lit-agent = "lit_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
