[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-analysis-agent"
version = "0.1.0"
description = "Literature PDF analysis agent for Markdown/JSON corpus conversion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Scientist Literature Analysis Agent" }]
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lit-analysis-agent = "lit_analysis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
