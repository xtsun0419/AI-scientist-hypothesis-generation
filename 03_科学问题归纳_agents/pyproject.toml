[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "question-synthesis-agent"
version = "0.1.0"
description = "Scientific question synthesis agent for the AI Scientist workflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Scientist Question Synthesis Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
question-synthesis-agent = "question_synthesis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
