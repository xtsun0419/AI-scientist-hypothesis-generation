domain: permanent_magnets
display_name: Permanent Magnets
from_year: 1900
to_year: 2026
sources:
  - openalex
  - crossref
  - semantic_scholar
  - arxiv
  - doaj
  - core
  - europe_pmc
queries:
  base_terms:
    - permanent magnet
    - rare earth magnet
    - rare-earth permanent magnet
    - NdFeB
    - neodymium iron boron
    - SmCo
    - samarium cobalt
    - ferrite magnet
    - hexaferrite magnet
    - AlNiCo
    - rare-earth-free permanent magnet
  performance_terms:
    - coercivity
    - remanence
    - maximum energy product
    - magnetocrystalline anisotropy
    - Curie temperature
  process_terms:
    - grain boundary diffusion
    - sintered magnet
    - hot deformation
    - melt spinning
    - hydrogen decrepitation
    - recycling
  query_templates:
    - "{base}"
    - "{base} {performance}"
    - "{base} {process}"
include_terms:
  - permanent magnet
  - rare earth magnet
  - rare-earth magnet
  - ndfeb
  - neodymium iron boron
  - smco
  - samarium cobalt
  - ferrite magnet
  - hexaferrite
  - alnico
  - coercivity
  - remanence
  - energy product
  - magnetocrystalline anisotropy
  - grain boundary diffusion
exclude_terms:
  - geomagnetic
  - paleomagnetic
  - biomagnetic
  - magnetic resonance imaging
  - mri
  - electric motor only
limits:
  max_results_per_query: 20
  request_timeout_seconds: 30
  polite_delay_seconds: 0.2
